<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quaternion Rocket Visualizer</title>
    <!-- Tailwind CSS for UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js for 3D Graphics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050510;
            font-family: 'Inter', sans-serif;
            color: white;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; /* Let clicks pass through to canvas */
        }
        .pointer-events-auto {
            pointer-events: auto;
        }
        
        /* Custom scrollbar for data log */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05); 
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2); 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(256, 255, 255, 0.4); 
        }
    </style>
</head>
<body class="bg-[#050508] text-white font-mono selection:bg-cyan-500/30">

    <!-- 3D Canvas Container -->
    <div id="canvas-container" class="absolute inset-0 z-0"></div>

    <!-- UI Overlay: Aerospace Telemetry HUD -->
    <div id="ui-layer" class="absolute inset-0 z-10 pointer-events-none p-6 flex flex-col justify-between">
        
        <!-- Header & Data Feed -->
        <div class="flex justify-between items-start">
            <div class="bg-[#0a0d14]/80 backdrop-blur-md border border-[#1e293b] p-5 rounded-lg shadow-2xl min-w-[340px] pointer-events-auto">
                <div class="flex items-center gap-3 mb-1">
                    <div class="w-2 h-2 rounded-full bg-cyan-500 animate-pulse"></div>
                    <h1 class="text-lg font-semibold tracking-widest text-cyan-400 uppercase">Aerospace Telemetry</h1>
                </div>
                <p class="text-xs text-gray-500 mb-5 tracking-wide font-sans">
                    VEHICLE ATTITUDE CONTROL | RAW QUATERNION (W, X, Y, Z)
                </p>
                
                <div class="space-y-4">
                    <!-- Status & Live Data -->
                    <div class="bg-black/60 border border-[#1e293b] p-4 rounded-md">
                        <div class="flex items-center justify-between mb-3 border-b border-[#1e293b] pb-2">
                            <span class="text-[10px] text-gray-500 uppercase tracking-widest">Link Status</span>
                            <div class="flex items-center gap-2">
                                <div id="status-indicator" class="w-1.5 h-1.5 rounded-full bg-red-500"></div>
                                <span id="status-text" class="text-[10px] font-bold text-red-500 uppercase tracking-widest">OFFLINE</span>
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-2 text-xs font-mono">
                            <div class="flex flex-col bg-gray-900/50 p-2 rounded border border-gray-800/50">
                                <span class="text-gray-500 text-[10px] mb-1">q0 (W)</span>
                                <span id="val-w" class="text-cyan-400 text-sm">0.0000</span>
                            </div>
                            <div class="flex flex-col bg-gray-900/50 p-2 rounded border border-gray-800/50">
                                <span class="text-gray-500 text-[10px] mb-1">q1 (X)</span>
                                <span id="val-x" class="text-cyan-400 text-sm">0.0000</span>
                            </div>
                            <div class="flex flex-col bg-gray-900/50 p-2 rounded border border-gray-800/50">
                                <span class="text-gray-500 text-[10px] mb-1">q2 (Y)</span>
                                <span id="val-y" class="text-cyan-400 text-sm">0.0000</span>
                            </div>
                            <div class="flex flex-col bg-gray-900/50 p-2 rounded border border-gray-800/50">
                                <span class="text-gray-500 text-[10px] mb-1">q3 (Z)</span>
                                <span id="val-z" class="text-cyan-400 text-sm">0.0000</span>
                            </div>
                        </div>
                    </div>

                    <!-- Controls -->
                    <div class="flex gap-2">
                        <button id="btn-connect" class="flex-1 py-2.5 px-3 bg-[#0f172a] hover:bg-[#1e293b] border border-[#334155] text-gray-300 text-xs font-semibold rounded transition-colors flex justify-center items-center gap-2 uppercase tracking-widest">
                            Connect Serial
                        </button>
                        <button id="btn-simulate" class="flex-1 py-2.5 px-3 bg-cyan-900/20 hover:bg-cyan-900/40 border border-cyan-800 text-cyan-400 text-xs font-semibold rounded transition-colors flex justify-center items-center gap-2 uppercase tracking-widest">
                            Simulate
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Serial Warning -->
        <div id="serial-warning" class="hidden pointer-events-auto bg-red-950/80 border border-red-900 p-3 rounded-md text-red-400 text-[11px] tracking-wide max-w-sm">
            ⚠️ Web Serial API unavailable. Requires a Chromium-based browser (Chrome, Edge). Simulation mode active.
        </div>
    </div>

    <script>
        /**
         * THREE.JS SCENE SETUP
         */
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050508, 0.015);

        // Camera
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(-15, 6, 20);
        camera.lookAt(0, 0, 0);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // Lighting (Studio CAD Setup)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
        scene.add(ambientLight);

        const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
        keyLight.position.set(10, 20, 15);
        scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight(0x00e5ff, 1.0);
        fillLight.position.set(-15, 0, -15);
        scene.add(fillLight);

        const backLight = new THREE.DirectionalLight(0xffffff, 0.6);
        backLight.position.set(0, 10, -20);
        scene.add(backLight);

        /**
         * AEROSPACE CAD MODEL GENERATION
         */
        const rocketGroup = new THREE.Group();
        
        // Material: Engineering Simulation (Dark, metallic, clearcoat)
        const cadMaterial = new THREE.MeshPhysicalMaterial({
            color: 0x111216,
            metalness: 0.8,
            roughness: 0.35,
            clearcoat: 0.8,
            clearcoatRoughness: 0.2,
            polygonOffset: true,
            polygonOffsetFactor: 1, 
            polygonOffsetUnits: 1
        });

        const wireMat = new THREE.LineBasicMaterial({ 
            color: 0x00e5ff, 
            transparent: true, 
            opacity: 0.2,
            depthTest: true
        });

        // 1. Aerodynamic Fuselage (LatheGeometry)
        const points = [];
        const length = 12;
        const segments = 60;
        
        for ( let i = 0; i <= segments; i ++ ) {
            const t = i / segments; 
            let y = (t * length) - (length / 2); // Center around Y=0
            let x;
            
            if (t > 0.75) {
                // Nose cone (Von Karman / Ogive hybrid shape)
                const nt = (t - 0.75) / 0.25; 
                x = 1.2 * Math.sqrt(1 - Math.pow(nt, 1.8));
            } else if (t < 0.15) {
                // Boat tail (Engine housing taper)
                const bt = t / 0.15; 
                x = 0.95 + 0.25 * bt;
            } else {
                // Main cylindrical body
                x = 1.2;
            }
            // Math.max avoids normal calculation errors at radius exactly 0
            points.push( new THREE.Vector2( Math.max(x, 0.001), y ) );
        }
        
        const fuselageGeo = new THREE.LatheGeometry( points, 64 );
        const fuselage = new THREE.Mesh(fuselageGeo, cadMaterial);
        
        // Add wireframe overlay directly matching geometry
        const fuselageWire = new THREE.LineSegments(new THREE.WireframeGeometry(fuselageGeo), wireMat);
        
        rocketGroup.add(fuselage);
        rocketGroup.add(fuselageWire);

        // 2. Swept Aerodynamic Fins
        const finShape = new THREE.Shape();
        finShape.moveTo(0, 0);
        finShape.lineTo(2.4, -1.2); 
        finShape.lineTo(2.4, -3.2);
        finShape.lineTo(0, -1.5);
        finShape.lineTo(0, 0);

        const finExtrudeOpts = { depth: 0.04, bevelEnabled: true, bevelSegments: 1, steps: 1, bevelSize: 0.02, bevelThickness: 0.02 };
        const finGeo = new THREE.ExtrudeGeometry(finShape, finExtrudeOpts);

        for(let i=0; i<4; i++) {
            const fin = new THREE.Mesh(finGeo, cadMaterial);
            const finWire = new THREE.LineSegments(new THREE.WireframeGeometry(finGeo), wireMat);
            
            const finPivot = new THREE.Group();
            
            // Position near the bottom (boat tail)
            fin.position.set(1.05, -4.0, -0.02); 
            finWire.position.copy(fin.position);
            
            finPivot.add(fin);
            finPivot.add(finWire);
            finPivot.rotation.y = -(Math.PI / 2) * i;
            rocketGroup.add(finPivot);
        }

        // Apply hardware rotations to this pivot group
        const rocketPivot = new THREE.Group();
        rocketPivot.add(rocketGroup);
        scene.add(rocketPivot);

        /**
         * ATTITUDE FRAME MAPPING
         *
         * Firmware side (aerospace convention): body X = nose, Y = right, Z = down.
         * The quaternion (w, x, y, z) rotates body vectors into the NED earth frame
         * (X = north, Y = east, Z = down). yaw/pitch/roll are the usual Z-Y-X angles.
         *
         * Three.js side: Y is up, and the rocket model's nose points along +Y.
         *   qEarthToScene : NED -> scene.  north = +X, east = +Z, down = -Y  (+90 deg about X)
         *   qModelToBody  : model -> body. nose (+Y) -> body X, model -X -> body Y (right),
         *                   model +Z -> body Z (down)                         (-90 deg about Z)
         *
         * Final rotation applied to the model:  qEarthToScene * q * qModelToBody
         */
        const QUAT_IS_BODY_TO_EARTH = true; // set to false if all rotations appear reversed
        const qEarthToScene = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0),  Math.PI / 2);
        const qModelToBody  = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), -Math.PI / 2);
        const qAttitude = new THREE.Quaternion();

        function setAttitude(w, x, y, z) {
            qAttitude.set(x, y, z, w).normalize(); // Three.js stores (x, y, z, w)
            if (!QUAT_IS_BODY_TO_EARTH) qAttitude.conjugate();
            rocketPivot.quaternion.copy(qEarthToScene).multiply(qAttitude).multiply(qModelToBody);
            updateUIValues(w, x, y, z);
        }

        // Body-axis triad attached to the rocket (delete this block to remove it):
        // red = X (forward), green = Y (right), blue = Z (down)
        [
            [new THREE.Vector3( 0, 1, 0), 0xff4d4d, 9],
            [new THREE.Vector3(-1, 0, 0), 0x4dff88, 5],
            [new THREE.Vector3( 0, 0, 1), 0x4d8dff, 5]
        ].forEach(([dir, color, len]) => {
            rocketGroup.add(new THREE.ArrowHelper(dir, new THREE.Vector3(0, 0, 0), len, color, 0.8, 0.4));
        });

        /**
         * ENVIRONMENT (Engineering Grid)
         */
        const gridHelper = new THREE.GridHelper(100, 100, 0x00e5ff, 0x1f2937);
        gridHelper.position.y = -7;
        gridHelper.material.opacity = 0.25;
        gridHelper.material.transparent = true;
        scene.add(gridHelper);

        const polarGrid = new THREE.PolarGridHelper(20, 16, 8, 64, 0x00e5ff, 0x1f2937);
        polarGrid.position.y = -6.99;
        polarGrid.material.opacity = 0.15;
        polarGrid.material.transparent = true;
        scene.add(polarGrid);

        /**
         * STATE & UI LOGIC
         */
        let isSimulating = false;
        let isConnected = false;
        let port = null;
        let reader = null;
        
        const btnConnect = document.getElementById('btn-connect');
        const btnSimulate = document.getElementById('btn-simulate');
        const statusIndicator = document.getElementById('status-indicator');
        const statusText = document.getElementById('status-text');
        
        const valW = document.getElementById('val-w');
        const valX = document.getElementById('val-x');
        const valY = document.getElementById('val-y');
        const valZ = document.getElementById('val-z');
        const serialWarning = document.getElementById('serial-warning');

        // Check Serial API support
        if (!("serial" in navigator)) {
            serialWarning.classList.remove('hidden');
            btnConnect.disabled = true;
            btnConnect.classList.add('opacity-50', 'cursor-not-allowed');
        }

        function setStatus(status) {
            if (status === 'connected') {
                statusIndicator.className = 'w-1.5 h-1.5 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.8)]';
                statusText.innerText = 'LINK ESTABLISHED';
                statusText.className = 'text-[10px] font-bold text-green-400 uppercase tracking-widest';
            } else if (status === 'simulating') {
                statusIndicator.className = 'w-1.5 h-1.5 rounded-full bg-cyan-500 shadow-[0_0_8px_rgba(6,182,212,0.8)]';
                statusText.innerText = 'SIMULATION MODE';
                statusText.className = 'text-[10px] font-bold text-cyan-400 uppercase tracking-widest';
            } else {
                statusIndicator.className = 'w-1.5 h-1.5 rounded-full bg-red-500';
                statusText.innerText = 'OFFLINE';
                statusText.className = 'text-[10px] font-bold text-red-500 uppercase tracking-widest';
            }
        }

        function updateUIValues(w, x, y, z) {
            valW.innerText = w.toFixed(4);
            valX.innerText = x.toFixed(4);
            valY.innerText = y.toFixed(4);
            valZ.innerText = z.toFixed(4);
        }

        /**
         * WEB SERIAL LOGIC
         */
        btnConnect.addEventListener('click', async () => {
            if (isConnected) {
                // Disconnect logic
                if (reader) {
                    await reader.cancel();
                }
                if (port) {
                    await port.close();
                }
                isConnected = false;
                btnConnect.innerText = "CONNECT SERIAL";
                btnConnect.classList.replace('bg-red-950/50', 'bg-[#0f172a]');
                btnConnect.classList.replace('border-red-900', 'border-[#334155]');
                btnConnect.classList.replace('text-red-400', 'text-gray-300');
                setStatus('disconnected');
                return;
            }

            try {
                // Request port and open it
                port = await navigator.serial.requestPort();
                // Standard IMU baudrate, adjustable if needed
                await port.open({ baudRate: 115200 }); 
                
                isConnected = true;
                isSimulating = false;
                btnSimulate.innerText = "SIMULATE";
                btnSimulate.classList.remove('bg-cyan-900/50');
                
                btnConnect.innerText = "DISCONNECT";
                btnConnect.classList.replace('bg-[#0f172a]', 'bg-red-950/50');
                btnConnect.classList.replace('border-[#334155]', 'border-red-900');
                btnConnect.classList.replace('text-gray-300', 'text-red-400');
                setStatus('connected');

                // Read Loop
                const textDecoder = new TextDecoderStream();
                const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
                reader = textDecoder.readable.getReader();
                readSerialLoop();

            } catch (err) {
                console.error("Serial connection error:", err);
                setStatus('disconnected');
            }
        });

        async function readSerialLoop() {
            let buffer = '';
            while (port.readable && isConnected) {
                try {
                    const { value, done } = await reader.read();
                    if (done) break;
                    if (value) {
                        buffer += value;
                        // Handle chunking and newline splitting
                        let lines = buffer.split(/\r?\n/);
                        // The last element is either empty string (if ends with newline) 
                        // or a partial line. Keep it in the buffer.
                        buffer = lines.pop(); 
                        
                        for (let line of lines) {
                            parseData(line.trim());
                        }
                    }
                } catch (error) {
                    console.error("Error reading data:", error);
                    break;
                }
            }
        }

        function parseData(line) {
            // Expected format: q0, q1, q2, q3
            // Which maps to: w, x, y, z
            if (!line || line.length === 0) return;
            
            const parts = line.split(',');
            if (parts.length === 4) {
                const w = parseFloat(parts[0]);
                const x = parseFloat(parts[1]);
                const y = parseFloat(parts[2]);
                const z = parseFloat(parts[3]);

                if (!isNaN(w) && !isNaN(x) && !isNaN(y) && !isNaN(z)) {
                    // Remap from the firmware's body/NED frame to the Three.js scene
                    setAttitude(w, x, y, z);
                }
            }
        }

        /**
         * SIMULATION LOGIC
         */
        btnSimulate.addEventListener('click', () => {
            if (isConnected) {
                alert("Please disconnect hardware before simulating.");
                return;
            }
            
            isSimulating = !isSimulating;
            if (isSimulating) {
                btnSimulate.innerText = "STOP SIM";
                btnSimulate.classList.add('bg-cyan-900/50');
                setStatus('simulating');
            } else {
                btnSimulate.innerText = "SIMULATE";
                btnSimulate.classList.remove('bg-cyan-900/50');
                setStatus('disconnected');
            }
        });

        // Window Resize Handler
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        /**
         * MOUSE INTERACTION FOR CAMERA (Orbiting)
         */
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        const rotationSpeed = 0.005;

        // Apply to document, but filter out UI clicks
        document.addEventListener('mousedown', (e) => {
            if (e.target.closest('.pointer-events-auto')) return;
            isDragging = true;
        });
        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaMove = {
                    x: e.offsetX - previousMousePosition.x,
                    y: e.offsetY - previousMousePosition.y
                };

                // Create quaternions for camera rotation
                const deltaRotationQuaternion = new THREE.Quaternion()
                    .setFromEuler(new THREE.Euler(
                        deltaMove.y * rotationSpeed,
                        deltaMove.x * rotationSpeed,
                        0,
                        'XYZ'
                    ));

                // Pivot camera around origin
                camera.position.applyQuaternion(deltaRotationQuaternion);
                camera.lookAt(0,0,0);
            }
            previousMousePosition = { x: e.offsetX, y: e.offsetY };
        });
        document.addEventListener('mouseup', () => {
            isDragging = false;
        });
        // Scroll to zoom
        document.addEventListener('wheel', (e) => {
            if (e.target.closest('.pointer-events-auto')) return;
            const zoomAmount = e.deltaY * 0.02;
            camera.position.z += zoomAmount;
            // clamp zoom
            if(camera.position.z < 5) camera.position.z = 5;
            if(camera.position.z > 60) camera.position.z = 60;
        });

        /**
         * ANIMATION LOOP
         */
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            if (isSimulating) {
                // Procedural attitude in aerospace terms (slow, sweeping turns),
                // built as a body->NED quaternion from Z-Y-X yaw/pitch/roll
                const yaw   = time * 0.5;
                const pitch = Math.sin(time * 0.25) * 0.4;
                const roll  = Math.cos(time * 0.15) * 0.2;
                const cy = Math.cos(yaw / 2),   sy = Math.sin(yaw / 2);
                const cp = Math.cos(pitch / 2), sp = Math.sin(pitch / 2);
                const cr = Math.cos(roll / 2),  sr = Math.sin(roll / 2);
                setAttitude(
                    cr * cp * cy + sr * sp * sy, // w
                    sr * cp * cy - cr * sp * sy, // x
                    cr * sp * cy + sr * cp * sy, // y
                    cr * cp * sy - sr * sp * cy  // z
                );
            }

            renderer.render(scene, camera);
        }

        // Start Loop
        window.onload = () => {
            setAttitude(1, 0, 0, 0); // level, nose north, until data arrives
            animate();
        };

    </script>
</body>
</html>
